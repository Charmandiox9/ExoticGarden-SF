name: Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package --file pom.xml -B

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExoticGarden-Jar
          path: target/ExoticGarden*.jar

      - name: Determine Release Tag and Title
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: release_info
        run: |
          VERSION="1.21.0"
          NAME="ExoticGarden"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="${NAME} ${TAG}"
          else
            TAG="v${VERSION}-b${{ github.run_number }}"
            TITLE="${NAME} v${VERSION} (Build #${{ github.run_number }})"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          # Prepare clean-named jar for release asset
          mkdir -p release_assets
          JAR_FILE=$(ls target/ExoticGarden*.jar | grep -v 'original-' | head -n 1)
          cp "$JAR_FILE" "release_assets/${NAME}-${TAG}.jar"
          cp "$JAR_FILE" "release_assets/${NAME}.jar"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: release_assets/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
